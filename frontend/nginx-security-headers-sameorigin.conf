# Header bảo mật — include ở cấp server VÀ ở mọi location có add_header riêng (nginx không kế thừa add_header khi location tự khai báo).
# HSTS không includeSubDomains (subdomain khác của domain có thể chưa có HTTPS).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# Bản cho trang được nhúng trong CHÍNH OfficeHub (tài liệu API ở trang Hệ thống → "Xem trong trang"): chỉ cho cùng origin nhúng, site khác vẫn bị chặn.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Micro / chia sẻ màn hình chỉ cho chính trang (voice văn phòng 3D); camera, vị trí không dùng.
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), display-capture=(self)" always;
