# Header bảo mật — include ở cấp server VÀ ở mọi location có add_header riêng (nginx không kế thừa add_header khi location tự khai báo).
# HSTS không includeSubDomains (subdomain khác của domain có thể chưa có HTTPS).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# Bản cho trang được nhúng trong CHÍNH OfficeHub (tài liệu API ở trang Hệ thống → "Xem trong trang"): chỉ cho cùng origin nhúng, site khác vẫn bị chặn.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
# CSP đầy đủ (TEST-19) — đang ở chế độ REPORT-ONLY: trình duyệt chỉ báo vi phạm về /api/csp-report (Api ghi log Warning → Seq),
# không chặn. Chạy vài ngày, xem log không còn vi phạm thật → đổi tên header thành Content-Security-Policy (bỏ -Report-Only)
# ở CẢ HAI file nginx-security-headers*.conf. Nguồn ngoài: Google Fonts, S3 (*.amazonaws.com: ảnh / video / PDF presigned + PUT tải lên),
# Firebase push (*.googleapis.com), video nhúng việc dự án (YouTube nocookie, Vimeo, Google Drive); voice LiveKit + SignalR qua wss: cùng domain.
# img-src cho mọi https: vì Markdown (mô tả việc, bảng tin) có ảnh ngoài. Đổi nguồn ngoài → sửa chuỗi này ở cả hai file.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.amazonaws.com; connect-src 'self' wss: https://*.amazonaws.com https://*.googleapis.com https://fonts.gstatic.com; frame-src 'self' https://*.amazonaws.com https://www.youtube-nocookie.com https://player.vimeo.com https://drive.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report; frame-ancestors 'self'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Micro / chia sẻ màn hình chỉ cho chính trang (voice văn phòng 3D); camera, vị trí không dùng.
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), display-capture=(self)" always;
