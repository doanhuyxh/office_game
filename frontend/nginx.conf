# Container "web" = cổng vào DUY NHẤT của OfficeHub (production): phục vụ FE + chia đường dẫn cho các service.
# Nginx (cùng máy hoặc VPS khác) chỉ cần proxy domain → <IP>:7080 (xem infra/nginx/officehub.conf).
#   /api/*      → api:8080
#   /rt/*       → realtime:8080 (SignalR WebSocket, token voice)
#   /mcp        → mcp:8080 (máy chủ MCP cho trợ lý AI, Streamable HTTP) + /.well-known/oauth-* (OAuth discovery)
#   /oauth/authorize → FE (trang đồng ý cấp quyền cho ứng dụng AI)
#   /livekit/*  → livekit:7880 (LiveKit__Url=wss://<domain>/livekit)
#   còn lại     → FE (SPA)

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 25m;   # upload file hợp đồng
  server_tokens off;

  # DNS nội bộ Docker, phân giải lúc chạy → nginx vẫn khởi động khi api / realtime chưa lên
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api      http://api:8080;
  set $realtime http://realtime:8080;
  set $mcp      http://mcp:8080;
  set $livekit  http://livekit:7880;

  # IP thật: chỉ tin X-Forwarded-For từ proxy trong TRUSTED_PROXY_IPS (realip.conf do nginx-realip.sh sinh)
  # → $remote_addr = IP người dùng; gửi Api đúng MỘT giá trị (Api dùng IP để chấm công "tại văn phòng" / "từ xa")
  include /etc/nginx/realip.conf;
  include /etc/nginx/snippets/security-headers.conf;
  proxy_set_header Host              $host;
  proxy_set_header X-Forwarded-For   $remote_addr;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_http_version 1.1;

  location /api/ { proxy_pass $api; }

  # Theo dõi uptime từ ngoài (chỉ liveness; /health/ready có chi tiết DB / S3 / SMTP nên KHÔNG mở ra ngoài)
  location = /health { proxy_pass $api; }

  location /rt/ {
    proxy_pass $realtime;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # MCP: phản hồi có thể là SSE (text/event-stream) → tắt buffer để trả từng sự kiện ngay
  location = /mcp {
    proxy_pass $mcp;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 5m;
    proxy_send_timeout 5m;
  }

  # OAuth discovery cho trợ lý AI (oauth-protected-resource, oauth-authorization-server) — OfficeHub.Mcp phục vụ
  location ^~ /.well-known/oauth- { proxy_pass $mcp; }

  location /livekit/ {
    rewrite ^/livekit/(.*)$ /$1 break;
    proxy_pass $livekit;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # File có hash trong tên → cache lâu dài
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/snippets/security-headers.conf; }

  # Model 3D (nhân vật ~2–3 MB / file, đồ đạc): tên không có hash → luôn kiểm tra lại (ETag → 304), nén gzip (~3–4 lần nhỏ hơn)
  location /models/ {
    types { model/gltf-binary glb; application/json json; text/plain txt; }
    gzip on;
    gzip_types model/gltf-binary application/octet-stream application/json;
    gzip_min_length 1024;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # SPA: mọi đường dẫn (/, /office, /leave...) → index.html (không cache)
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; }
}
