# Container "web" = cổng vào DUY NHẤT của OfficeHub (production): phục vụ FE + chia đường dẫn cho các service.
# Nginx trên VPS chỉ cần proxy domain → 127.0.0.1:7080 (xem infra/nginx/officehub.conf).
#   /api/*      → api:8080
#   /rt/*       → realtime:8080 (SignalR WebSocket, token voice)
#   /livekit/*  → LiveKit trên host :7880 (LiveKit__Url=wss://<domain>/livekit)
#   còn lại     → FE (SPA)

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 25m;   # upload file hợp đồng
  server_tokens off;

  # DNS nội bộ Docker, phân giải lúc chạy → nginx vẫn khởi động khi api / realtime chưa lên
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api      http://api:8080;
  set $realtime http://realtime:8080;
  set $livekit  http://host.docker.internal:7880;

  # Giữ nguyên IP thật + https do nginx VPS gửi (Api dùng IP để chấm công "tại văn phòng" / "từ xa")
  proxy_set_header Host              $host;
  proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_http_version 1.1;

  location /api/ { proxy_pass $api; }

  location /rt/ {
    proxy_pass $realtime;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /livekit/ {
    rewrite ^/livekit/(.*)$ /$1 break;
    proxy_pass $livekit;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # File có hash trong tên → cache lâu dài
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  # SPA: mọi đường dẫn (/, /office, /leave...) → index.html (không cache)
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
