# Mẫu cấu hình runner — file THẬT đặt NGOÀI repo (vd /etc/officehub-runner/agents.yaml, chmod 600, chủ = user chạy runner).
# Có token → KHÔNG commit (agent-runner/agents.yaml đã nằm trong .gitignore).
officehub:
  mcp_url: https://office.lokid.me/mcp          # MCP của OfficeHub (token AI của từng agent)

telegram:
  # api_url: https://api.telegram.org            # chỉ đổi khi test với máy chủ giả
  group_chat_id: "-1001234567890"               # nhóm riêng tư nhận tin đánh thức (trang Hệ thống → Cấu hình → Telegram)

git:
  # executable: /usr/bin/git                    # file chạy git (vd /usr/bin/git, /opt/homebrew/bin/git, C:\\Program Files\\Git\\cmd\\git.exe); bỏ trống = git trong PATH
  # Dùng tài khoản git SẴN CÓ của máy: user.name / user.email + credential helper / SSH key trong HOME — runner không lưu token git,
  # không đổi tác giả; commit của agent (mode worktree) được thêm trailer "Agent: <mã NV>" + "Task: <mã việc>" (mode in_place không dùng hook → không có trailer).

runner:
  data_dir: /var/lib/officehub-runner            # SQLite (hàng đợi, phiên, chi phí) + thư mục tạm của từng job
  worktrees_dir: /srv/agents/worktrees           # PHẢI nằm ngoài mọi repo (tránh đọc nhầm .env của repo chính)
  max_parallel: 2                                # tổng số phiên chạy cùng lúc trên máy (mỗi agent tối đa 1 — kể cả phiên chat / họp)
                                                 # tin chat_mention / meeting_turn: phiên ngắn chỉ có tool MCP, dùng `executor` của agent; đang họp thì việc chờ
  base_branch: main
  # activity_stream: true                       # gửi lệnh / diff / suy nghĩ của agent lên OfficeHub để người đứng gần bot trong 3D xem trực tiếp (đã che bí mật); false = tắt
  # log_format: auto                            # auto (terminal → dòng dễ đọc có màu; systemd / pipe → JSON) | json | pretty; hoặc env RUNNER_LOG_FORMAT

agents:
  - employee_code: NV120
    telegram_bot: "@agent_dev01_bot"             # bot Telegram của agent (trùng "Bot Telegram" của tài khoản trên OfficeHub)
    telegram_token: "123456789:AA…"             # token bot của agent — runner long-poll getUpdates bằng token này
    token: "ohk_xxxxxxxxxxxxxxxx"               # token AI (MCP) của tài khoản agent NV120 — quyền Employee
    repo: /srv/agents/NV120/office_game          # bản clone riêng của agent (có remote origin)
    env_file: /etc/officehub-runner/NV120.env    # tuỳ chọn: biến môi trường THỬ NGHIỆM (DB tạm, S3 thử, Mailpit…) — không phải .env production
    # workspace:                                 # tuỳ chọn; bỏ trống = mode worktree (worktree riêng + push + PR)
    #   mode: in_place                           # in_place = làm NGAY trong `repo`, commit vào nhánh đang checkout, KHÔNG push / PR (người thật tự xem + push)
    #                                            #   · từ chối khi repo còn thay đổi chưa commit, đang ở main / master / nhánh base hoặc detached HEAD
    #                                            #   · không dùng chung repo với agent khác; nên là bản clone RIÊNG của agent
    #   allow_base_branch: false                 # true = cho chạy khi đang ở main / master / base
    #   allow_env_files: false                   # true = cho repo có .env ở gốc (CLI đọc được file đó!) — mặc định doctor tắt agent
    #   mode: none                               # none = agent NGHIỆP VỤ (Kinh doanh, Tài chính, Nhân sự…): không cần `repo`, không git / PR.
    #                                            #   · CLI chạy trong thư mục trống {data_dir}/work/<mã NV>/<mã việc>, CHỈ có tool MCP của OfficeHub
    #                                            #     (adapter claude: tắt Bash / đọc ghi file; adapter custom phải tự giới hạn) — xem agent NV130 bên dưới
    executor:
      kind: claude                               # claude | custom
      bin: /usr/local/bin/claude
      model: claude-sonnet-5-5
      home: /srv/agents/NV120/home               # HOME riêng (đăng nhập CLI, gh auth login, ~/.claude)
      timeout_min: 60                            # hết giờ → kill cả process group
      max_budget_usd: 5                          # claude: --max-budget-usd
      extra_args: []

  - employee_code: NV121
    telegram_bot: "@agent_dev02_bot"
    telegram_token: "987654321:AA…"
    token: "ohk_yyyyyyyyyyyyyyyy"
    repo: /srv/agents/NV121/office_game
    executor:
      kind: custom                               # CLI bất kỳ, tự khai báo tham số
      bin: /opt/tools/my-agent
      home: /srv/agents/NV121/home
      timeout_min: 60
      args: ["run", "--cwd", "{cwd}", "--model", "{model}", "--mcp", "{mcp_config}", "--prompt-file", "{prompt_file}"]
      resume_args: ["--session", "{session_id}"]  # tuỳ chọn
      output: { format: text }                    # text | json (dòng JSON cuối có session_id / cost_usd / summary)

  - employee_code: NV130                         # agent nghiệp vụ: chỉ làm việc với OfficeHub qua MCP
    telegram_bot: "@agent_sales01_bot"
    telegram_token: "555555555:AA…"
    token: "ohk_zzzzzzzzzzzzzzzz"
    workspace:
      mode: none                                 # không có `repo`; runner.data_dir nên nằm ngoài mọi repo (doctor cảnh báo nếu không)
    executor:
      kind: claude
      bin: /usr/local/bin/claude
      model: claude-sonnet-5-5
      home: /srv/agents/NV130/home
      timeout_min: 30
      max_budget_usd: 2

  - employee_code: NV140                         # agent THIẾT KẾ giao diện: OfficeHub + Stitch + Figma, không repo
    telegram_bot: "@agent_design01_bot"
    telegram_token: "666666666:AA…"
    token: "ohk_dddddddddddddddd"
    env_file: /etc/officehub-runner/NV140.env    # chmod 600, một dòng: STITCH_API_KEY=… (tạo khoá trong Stitch → Settings)
    workspace:
      mode: none                                 # tắt Bash / đọc ghi file; tool MCP (OfficeHub, Stitch, Figma) vẫn dùng được
    executor:
      kind: claude
      bin: /usr/local/bin/claude
      model: claude-sonnet-5-5
      home: /srv/agents/NV140/home               # Figma chỉ đăng nhập OAuth: đăng nhập tay MỘT lần với HOME này (.agent/business/agent-runner-workspace.md)
      timeout_min: 45
      max_budget_usd: 4
      # MCP thêm ngoài OfficeHub: chép design-mcp.example.json ra ngoài repo; khoá lấy từ env_file qua ${STITCH_API_KEY}, không ghi vào file
      extra_args: ["--mcp-config", "/etc/officehub-runner/design-mcp.json"]
