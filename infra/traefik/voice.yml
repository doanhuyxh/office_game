# Traefik (file provider): https://VOICE_DOMAIN → LiveKit (network_mode: host, cổng 7880).
# Trình duyệt chỉ nối wss:// khi trang chạy https → LiveKit__Url=wss://VOICE_DOMAIN.
# Firewall: CHẶN 7880 từ ngoài (chỉ Traefik gọi vào); MỞ 7881/tcp + 50000-60000/udp cho WebRTC.
http:
  routers:
    voice:
      rule: Host(`{{ env "VOICE_DOMAIN" }}`)
      entryPoints: [websecure]
      service: livekit
      tls:
        certResolver: le
  services:
    livekit:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:7880
