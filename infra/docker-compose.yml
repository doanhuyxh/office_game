# OfficeHub production. Nginx (cùng VPS hoặc VPS khác) chỉ cần proxy DOMAIN → <IP>:${HTTP_PORT:-7080} (infra/nginx/officehub.conf).
#   cd /opt/officehub && sh scripts/deploy.sh        (git pull + build + chạy + dọn cache build)
#   hoặc: docker compose --env-file .env -f infra/docker-compose.yml up -d --build
#
# Một domain, một cổng — container "web" (nginx) chia đường dẫn (frontend/nginx.conf):
#   /            → FE (trang nhân sự, /office = văn phòng 3D)
#   /api/*       → api        /rt/* → realtime (SignalR, token voice)
#   /livekit/*   → livekit (network_mode: host, :7880) — LiveKit__Url=wss://APP_DOMAIN/livekit
#
# Tuỳ chọn:  --profile logs     chạy Seq (xem log: ssh -L 5341:localhost:5341 vps)
#            --profile localdb  chạy Postgres ngay trên VPS (đặt POSTGRES_HOST=postgres)
# Dùng file env khác tên .env:  OFFICEHUB_ENV_FILE=../.env.pro docker compose --env-file .env.pro -f infra/docker-compose.yml …
name: officehub

# Log Docker xoay vòng: tối đa 3 × 10 MB mỗi container (không thì log lớn dần tới khi đầy ổ cứng)
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-backend: &backend
  <<: *logging
  image: officehub/backend:latest
  env_file: ["${OFFICEHUB_ENV_FILE:-../.env}"]
  environment: &backend-env
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_HTTP_PORTS: "8080"
    ConnectionStrings__Default: Host=${POSTGRES_HOST:-postgres};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    DataProtection__KeysPath: /keys
    Seq__Url: ${SEQ_URL:-}           # --profile logs → SEQ_URL=http://seq:5341
    App__BaseUrl: https://${APP_DOMAIN}
    Realtime__MapPath: /app/shared/office-map.json
    Realtime__ApiBaseUrl: http://api:8080   # Realtime hỏi Api để kiểm tra phiên đăng nhập
  volumes:
    - keys:/keys
  restart: unless-stopped

services:
  api:
    <<: *backend
    build: { context: .., dockerfile: backend/Dockerfile }
    environment:
      <<: *backend-env
      SERVICE: OfficeHub.Api
    depends_on:
      postgres: { condition: service_healthy, required: false }

  realtime:
    <<: *backend
    environment:
      <<: *backend-env
      SERVICE: OfficeHub.Realtime
      LiveKit__ApiUrl: http://host.docker.internal:7880   # đẩy người khỏi room voice qua mạng nội bộ
    extra_hosts: ["host.docker.internal:host-gateway"]
    pull_policy: never  # dùng chung image officehub/backend do service api build
    depends_on: [api]

  web:
    <<: *logging
    image: officehub/web:latest
    build: { context: .., dockerfile: frontend/Dockerfile }
    # Mặc định mở 0.0.0.0 để nginx ở VPS khác proxy vào. Docker BỎ QUA ufw → chặn cổng này bằng firewall nhà cung cấp
    # (chỉ cho IP VPS proxy). Nginx cùng máy: HTTP_BIND=127.0.0.1
    ports: ["${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-7080}:80"]
    environment:
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}   # IP VPS chạy nginx proxy (cách nhau dấu phẩy)
    extra_hosts: ["host.docker.internal:host-gateway"]   # /livekit → LiveKit trên host
    restart: unless-stopped

  livekit:
    <<: *logging
    image: livekit/livekit-server:v1.13.11
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LiveKit__ApiKey}: ${LiveKit__ApiSecret}"
    volumes: [./livekit/livekit.yaml:/etc/livekit.yaml:ro]
    network_mode: host               # WebRTC cần UDP trực tiếp: mở 7881/tcp + 50000-60000/udp trên firewall
    restart: unless-stopped

  backup:
    <<: *logging
    image: postgres:18-alpine   # pg_dump phải cùng hoặc mới hơn bản server (DB công ty: 18.6)
    env_file: ["${OFFICEHUB_ENV_FILE:-../.env}"]
    environment:
      PGHOST: ${POSTGRES_HOST:-postgres}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - keys:/keys:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache aws-cli >/dev/null && while true; do /bin/sh /backup.sh; sleep 86400; done"]
    depends_on:
      postgres: { condition: service_healthy, required: false }
    restart: unless-stopped

  postgres:
    <<: *logging
    image: postgres:18-alpine
    profiles: [localdb]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped   # KHÔNG mở cổng ra ngoài

  seq:
    <<: *logging
    image: datalust/seq:2025.2
    profiles: [logs]
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTADMIN_PASSWORD: ${SEQ_ADMIN_PASSWORD}
    volumes: [seqdata:/data]
    ports: ["127.0.0.1:5341:80"]
    restart: unless-stopped

volumes:
  pgdata:
  seqdata:
  keys:
