# Nginx (VPS proxy): CHỈ proxy domain → container "web" (cổng 7080). Mọi đường dẫn (/api, /rt, /livekit) do container tự chia.
# Nginx ở VPS KHÁC: đổi 127.0.0.1 thành IP VPS chạy OfficeHub, và đặt TRUSTED_PROXY_IPS=<IP VPS này> trong .env của OfficeHub.
#   sudo cp infra/nginx/officehub.conf /etc/nginx/conf.d/officehub.conf   (hoặc sites-available + ln -s vào sites-enabled)
#   → đổi server_name → sudo nginx -t && sudo systemctl reload nginx
#   → SSL: sudo certbot --nginx --redirect -d office.example.com   (--redirect: certbot thêm khối cổng 80 → 301 https://, TEST-19)
#     Kiểm tra sau certbot: curl -sI http://office.example.com → 301 Location: https://…; curl -sI https://… → có Strict-Transport-Security, không lộ phiên bản nginx
# Nếu nginx báo trùng "connection_upgrade" (site khác đã khai báo map này) → xoá dòng map bên dưới.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name office.example.com;   # = APP_DOMAIN
  client_max_body_size 25m;
  server_tokens off;   # không lộ phiên bản nginx trong header / trang lỗi (TEST-19); đặt trong server để không trùng với site khác

  # HSTS ngay ở proxy ngoài (có cả trên trang lỗi 502 của chính proxy); ẩn bản container web gửi lên để không bị 2 header.
  # Trình duyệt chỉ nhận HSTS qua HTTPS → có hiệu lực sau khi certbot bật SSL. Không includeSubDomains (subdomain khác có thể chưa HTTPS).
  proxy_hide_header Strict-Transport-Security;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    proxy_pass http://127.0.0.1:7080;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;   # IP thật → chấm công "tại văn phòng"
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;                # WebSocket: văn phòng 3D + voice
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
}
