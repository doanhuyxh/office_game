# LiveKit production. Key/secret lấy từ biến LIVEKIT_KEYS (docker-compose).
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
# Traefik không proxy được UDP → đặt LiveKit sau một reverse proxy TLS cho cổng 7880
# hoặc bật TLS trực tiếp trong LiveKit (xem docs.livekit.io/home/self-hosting/vm).
# TURN (người dùng sau mạng công ty / NAT chặn UDP): LiveKit có TURN dựng sẵn — cần chứng chỉ TLS cho domain TURN.
# Bỏ comment + điền domain / file chứng chỉ khi deploy (chưa thử trên VPS):
# turn:
#   enabled: true
#   domain: turn.congty.vn
#   tls_port: 5349
#   udp_port: 3478
#   cert_file: /certs/turn.crt
#   key_file: /certs/turn.key
